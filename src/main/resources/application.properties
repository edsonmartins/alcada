# ============================================================================
# Alçada — configuração base
# Postgres é a única dependência de infraestrutura (ADR-0023).
# ============================================================================

quarkus.application.name=alcada
quarkus.http.port=8080

# Tempo em UTC no banco; apresentação em America/Sao_Paulo (CLAUDE.md §4)
quarkus.hibernate-orm.jdbc.timezone=UTC

# Flyway: migrations versionadas, validadas na subida
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false

# Hibernate não gera schema — Flyway é a fonte da verdade
quarkus.hibernate-orm.schema-management.strategy=none

# Guarda de org_id (INV-15): StatementInspector do Hibernate, fail-closed.
# Instanciado uma vez no boot; a classe é @RegisterForReflection para o nativo.
quarkus.hibernate-orm.unsupported-properties."hibernate.session_factory.statement_inspector"=app.alcada.plataforma.multitenancy.internal.GuardaOrgId

# Health
quarkus.smallrye-health.root-path=/q/health

# Gateway de modelos (ADR-0020, RFC-0007). A lista `only` é ANEXO CONTRATUAL do
# RIPD (suboperadores), não configuração casual — mudá-la é evento contratual.
# Opção C: um único provedor ZDR (DeepInfra), uma linha no RIPD.
gateway.only=deepinfra
# Roteamento por tarefa: extração (schema estrito, barato) vs redação (qualidade).
gateway.modelo.extracao=google/gemma-3-12b-it
gateway.modelo.redacao=meta-llama/llama-3.3-70b-instruct
gateway.retry.max=3
gateway.retry.base-ms=200

# Liga o transporte real ao OpenRouter (TransporteHttp). Default OFF (dev/test =
# stub, nunca sai dado). Ligado em prod e no piloto (demo) — a chamada real ainda
# depende da chave; sem ela, degrada como o stub. RESTRITA nunca sai (vai local).
gateway.openrouter.enabled=false
%prod.gateway.openrouter.enabled=true
%demo.gateway.openrouter.enabled=true

# Consulta em linguagem natural (020): com o gateway real ligado, deixa o LLM
# montar a consulta a partir de fala livre (INV-10: só escolhe template fechado).
%demo.consulta.usar-llm=true

# CREDENCIAL — nunca hardcoded, nunca em log/commit/trilha. Só por env.
gateway.openrouter.api-key=${OPENROUTER_API_KEY:}
#
# FIAÇÃO vs DADO REAL (ADR-0020, decisão de piloto):
#   - Fiação (prova de que a requisição sai com política correta): pode usar um
#     modelo :free, pois nenhum dado de cliente atravessa. Rode o build de prod
#     localmente com gateway.modelo.*=<...>:free e dado SINTÉTICO.
#   - Dado real do cliente SÓ pode passar pelos endpoints PAGOS com ZDR
#     verificados (DeepInfra: gemma-3-12b-it, llama-3.3-70b-instruct). O modelo
#     :free NUNCA vê dado real.
# O transporte real (TransporteHttp) só existe no profile `prod`; dev/test usam
# um stub que nunca bate no host externo (TransporteStub).

# ----------------------------------------------------------------------------
# Multi-tenant: org_id resolvido do token OIDC (INV-15).
# Sem IdP local nesta fase; OIDC fica desabilitado em dev/test e é
# obrigatório em prod (configurado por ambiente).
# ----------------------------------------------------------------------------

# ---- %dev : Postgres local (brew postgresql@17), sem Dev Services (sem Docker) ----
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=alcada
%dev.quarkus.datasource.password=alcada
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/alcada
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.oidc.enabled=false

# ---- %test : banco dedicado, migrations recriadas a cada execução ----
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=alcada
%test.quarkus.datasource.password=alcada
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/alcada_test
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.oidc.enabled=false
# Workers são acionados manualmente nos testes (determinismo); tick desligado.
%test.quarkus.scheduler.enabled=false
# Sem backoff real nos testes (determinismo).
%test.gateway.retry.base-ms=0
# Limiar de mineração baixo nos testes (o padrão 15 exigiria muitos seeds).
%test.mineracao.min-ocorrencias=3
%test.esteira.checklist.min-reprovacoes=2

# ---- %prod : tudo por variável de ambiente; OIDC obrigatório ----
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${ALCADA_DB_USER}
%prod.quarkus.datasource.password=${ALCADA_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${ALCADA_DB_URL}
%prod.quarkus.oidc.enabled=true
%prod.quarkus.oidc.auth-server-url=${ALCADA_OIDC_URL}
%prod.quarkus.oidc.client-id=${ALCADA_OIDC_CLIENT_ID}
# A API valida o Bearer (JWT via JWKS do ArchGuard); o login/redirect é dos clients
# (web/mobile). org_id e pessoa_id vêm das claims do token (ResolucaoOrgId/Pessoa).
%prod.quarkus.oidc.application-type=service

# ---- %demo : PILOTO sem IdP (não há OIDC reaproveitável nesta fase). ----
# OIDC desligado; o org_id/pessoa vêm dos headers X-Org-Id / X-Pessoa-Id
# (ResolucaoOrgId cai no header quando não há token). A guarda de tenant
# (INV-15) continua valendo — o header é validado como UUID e escopa toda query.
# A imagem é buildada com -Dquarkus.profile=demo: os adapters externos
# (@IfBuildProfile("prod")) ficam de fora e entram os STUBS de Linktor/OpenRouter.
# Nenhum dado real de cliente sai por canal/modelo neste profile — as integrações
# reais só existem no build `prod`. Datasource e tudo o mais por variável de ambiente.
%demo.quarkus.datasource.db-kind=postgresql
%demo.quarkus.datasource.username=${ALCADA_DB_USER}
%demo.quarkus.datasource.password=${ALCADA_DB_PASSWORD}
%demo.quarkus.datasource.jdbc.url=${ALCADA_DB_URL}
%demo.quarkus.oidc.enabled=false

# ---- Calendário do gestor (RFC-0009) ----
# Janela entre o "sim" e o compromisso aparecer na agenda: o efeito externo fica
# no outbox até vencer, e desfazer antes disso significa que a agenda nunca soube
# (INV-14). Curta de propósito — a janela do motor (horas) deixaria o gestor
# procurando um evento que ainda não existe.
alcada.calendario.janela=PT5M

# Adaptador real do Google (build-time). Ligado no piloto (demo) e em prod; nos
# demais perfis valem os stubs — dev/test não falam com o Google nem tocam agenda.
# É gate por propriedade, e não por profile, justamente para o piloto ter
# calendário de verdade enquanto Linktor/OpenRouter seguem em stub.
alcada.calendario.real=false
%prod.alcada.calendario.real=true
%demo.alcada.calendario.real=true

# OAuth do Google — por ambiente, nunca no repositório.
%prod.alcada.google.client-id=${ALCADA_GOOGLE_CLIENT_ID:}
%prod.alcada.google.client-secret=${ALCADA_GOOGLE_CLIENT_SECRET:}
%demo.alcada.google.client-id=${ALCADA_GOOGLE_CLIENT_ID:}
%demo.alcada.google.client-secret=${ALCADA_GOOGLE_CLIENT_SECRET:}

# Chave do cofre (AES-256 em base64) que cifra os tokens de calendário no banco.
# OBRIGATÓRIA onde o calendário é real: sem ela a aplicação não sobe, para não
# cifrar token de verdade com a chave de desenvolvimento (que está no código).
%prod.alcada.cripto.chave=${ALCADA_CRIPTO_CHAVE}
%demo.alcada.cripto.chave=${ALCADA_CRIPTO_CHAVE}
