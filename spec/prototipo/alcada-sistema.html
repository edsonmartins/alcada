<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alçada — controle de decisões do gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#131A2B; --tinta-2:#1B2439; --tinta-3:#26314C;
  --papel:#EEF0F4; --branco:#fff; --papel-2:#F7F8FB;
  --linha:#DCE0E9; --linha-2:#C6CDDA;
  --texto:#1B2233; --fraco:#6A7590; --fraco-2:#98A2B8;
  --resolver:#0F8A63; --repassar:#2B57D4; --reservar:#C2700F; --repousar:#7A879F;
  --adiar:#6D4AC4; --quente:#D6246E;
  --sb:236px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--texto);font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.022em;line-height:1.1}
.mono{font-family:'IBM Plex Mono',monospace}
:focus-visible{outline:2px solid var(--repassar);outline-offset:1px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c3cad8;border-radius:6px}

.app{display:flex;height:100vh}

/* ---------- sidebar ---------- */
.sb{width:var(--sb);background:var(--tinta);color:#fff;display:flex;flex-direction:column;flex:none}
.sb-topo{padding:16px 16px 14px;border-bottom:1px solid #ffffff14}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo i{width:9px;height:9px;background:var(--quente);border-radius:2px;display:block}
.logo-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7C89A8;margin-top:5px}
.sb-nav{padding:10px 8px;flex:1;overflow-y:auto}
.sb-grp{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#5F6C8A;padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:7px;color:#B4BFD6;font-size:13.5px;text-align:left;transition:.13s}
.nav:hover{background:#ffffff0e;color:#fff}
.nav.on{background:var(--tinta-3);color:#fff;font-weight:500}
.nav .ic{width:16px;text-align:center;font-size:13px;opacity:.85;flex:none}
.nav .n{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8391AF}
.nav.on .n{color:#fff}
.nav .n.alerta{background:var(--quente);color:#fff;padding:1px 6px;border-radius:20px}
.sb-pe{padding:12px 14px;border-top:1px solid #ffffff14}
.eu{display:flex;align-items:center;gap:9px}
.av{width:28px;height:28px;border-radius:50%;background:var(--tinta-3);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.eu b{font-size:12.5px;font-weight:600;display:block}
.eu span{font-size:11px;color:#7C89A8}

/* ---------- topo ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:54px;background:var(--branco);border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px;padding:0 18px;flex:none}
.hamb{display:none}
.busca{flex:1;max-width:380px;position:relative}
.busca input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--linha);border-radius:7px;background:var(--papel-2);font-size:13.5px}
.busca input:focus{background:#fff;border-color:var(--linha-2);outline:none}
.busca .lupa{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fraco-2);font-size:12px}
.top-dir{margin-left:auto;display:flex;align-items:center;gap:8px}
.bt{padding:7px 13px;border-radius:7px;font-size:13px;font-weight:500;border:1px solid var(--linha-2);background:#fff;transition:.13s;white-space:nowrap}
.bt:hover{border-color:var(--tinta);background:var(--papel-2)}
.bt.pri{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.bt.pri:hover{background:var(--tinta-2)}
.bt.mini{padding:5px 10px;font-size:12.5px}
.sino{position:relative;padding:7px 9px;border-radius:7px;border:1px solid transparent}
.sino:hover{background:var(--papel-2)}
.sino b{position:absolute;top:2px;right:2px;background:var(--quente);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:9px;padding:1px 4px;border-radius:20px}

/* ---------- conteúdo ---------- */
.corpo{flex:1;overflow-y:auto;padding:20px 22px 60px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.cab h1{font-size:23px;font-weight:800}
.cab .sub{color:var(--fraco);font-size:13px;margin-top:3px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fchip{padding:5px 11px;border:1px solid var(--linha-2);border-radius:20px;font-size:12.5px;background:#fff;color:var(--fraco);transition:.13s}
.fchip:hover{border-color:var(--tinta)}
.fchip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.fsep{width:1px;height:18px;background:var(--linha-2);margin:0 4px}

/* lista */
.lista{background:var(--branco);border:1px solid var(--linha);border-radius:9px;overflow:hidden}
.lr{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--linha);cursor:pointer;transition:background .1s}
.lr:last-child{border-bottom:none}
.lr:hover{background:var(--papel-2)}
.lr.sel{background:#2b57d40a}
.lr-bar{width:3px;height:30px;border-radius:2px;background:var(--c,var(--linha-2));flex:none}
.lr-mid{flex:1;min-width:0}
.lr-t{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-m{display:flex;gap:9px;align-items:center;margin-top:3px;font-size:12px;color:var(--fraco);flex-wrap:wrap}
.lr-dir{display:flex;align-items:center;gap:8px;flex:none}
.pill{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.p-entrada{background:#2b57d414;color:var(--repassar)}
.p-delegado{background:#0f8a6314;color:var(--resolver)}
.p-agendado{background:#c2700f18;color:var(--reservar)}
.p-dormindo{background:#7a879f1c;color:var(--repousar)}
.p-adiado{background:#6d4ac418;color:var(--adiar)}
.p-fechado{background:#e8ebf1;color:var(--fraco)}
.p-quente{background:#d6246e14;color:var(--quente)}
.p-n{border:1px solid var(--linha-2);color:var(--fraco)}
.rel{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--fraco);white-space:nowrap}
.rel.urg{color:var(--quente);font-weight:500}
.vazio-l{padding:38px;text-align:center;color:var(--fraco);font-size:13.5px}

/* cards / métricas */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.mcard{background:var(--branco);border:1px solid var(--linha);border-radius:9px;padding:14px 16px}
.mcard b{font-family:'Bricolage Grotesque',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.04em;display:block;line-height:1}
.mcard span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco);display:block;margin-top:6px}
.mcard em{font-style:normal;font-size:12px;color:var(--fraco);display:block;margin-top:4px}
.painel-b{background:var(--branco);border:1px solid var(--linha);border-radius:9px;padding:18px 20px;margin-bottom:14px}
.painel-b h2{font-size:16px;font-weight:600;margin-bottom:3px}
.painel-b .h-sub{font-size:12.5px;color:var(--fraco);margin-bottom:14px}

/* drawer */
.dr-bg{position:fixed;inset:0;background:#131a2b40;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.dr-bg.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--branco);border-left:1px solid var(--linha);transform:translateX(100%);transition:transform .24s cubic-bezier(.3,.8,.3,1);z-index:41;display:flex;flex-direction:column}
.dr.on{transform:none}
.dr-top{padding:14px 18px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px}
.dr-top .id{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--fraco)}
.dr-x{margin-left:auto;padding:5px 9px;border-radius:6px;color:var(--fraco);font-size:16px;line-height:1}
.dr-x:hover{background:var(--papel-2);color:var(--texto)}
.dr-corpo{flex:1;overflow-y:auto;padding:18px}
.dr h2{font-size:19px;font-weight:600;margin-bottom:10px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:13px;margin:14px 0}
.kv dt{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco);padding-top:2px}
.kv dd{margin:0}
.bloco{background:var(--papel-2);border:1px solid var(--linha);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.bloco .rot{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);margin-bottom:5px}
.bloco.diag{background:#6d4ac40b;border-color:#6d4ac433;color:#4b3190}
.hist{list-style:none;margin:10px 0 0;padding:0}
.hist li{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--linha)}
.hist li:last-child{border:none}
.hist .q{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--fraco);flex:none;width:64px}
.dr-pe{border-top:1px solid var(--linha);padding:14px 18px;background:var(--papel-2)}
.acoes4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ac{padding:10px 6px;border:1px solid var(--linha-2);border-radius:8px;background:#fff;font-size:12.5px;font-weight:600;color:var(--c);transition:.13s;text-align:center}
.ac:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#fff)}
.ac small{display:block;font-weight:400;font-size:10px;color:var(--fraco);margin-top:2px;letter-spacing:.02em}
.ac-adiar{width:100%;margin-top:6px;padding:9px;border:1px dashed var(--adiar);border-radius:8px;color:var(--adiar);font-size:12.5px;font-weight:500;background:#fff}
.ac-adiar:hover{background:#6d4ac40d}
.form{margin-top:12px;background:#fff;border:1px solid var(--linha);border-radius:8px;padding:14px}
.form .rot{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);margin-bottom:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.ch{padding:5px 11px;border:1px solid var(--linha-2);border-radius:20px;font-size:12.5px;background:#fff;transition:.13s}
.ch:hover{border-color:var(--repassar)}
.ch.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.ch.wide{border-radius:7px;text-align:left;width:100%}
.nudge{background:#6d4ac40d;border:1px solid #6d4ac438;border-radius:8px;padding:12px;font-size:12.5px;color:#4b3190;margin-bottom:10px}

/* esteira */
.board{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:9px;overflow-x:auto;padding-bottom:6px}
.bcol{background:#fff;border:1px solid var(--linha);border-radius:9px;padding:10px;min-width:150px}
.bcol.dele{border-color:var(--quente);background:#d6246e06}
.bcol-t{font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.bcol-d{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco-2);margin-bottom:9px}
.bcol.dele .bcol-d{color:var(--quente)}
.bcard{background:var(--papel-2);border:1px solid var(--linha);border-radius:7px;padding:9px 10px;margin-bottom:6px;font-size:12.5px;cursor:pointer;transition:.13s}
.bcard:hover{border-color:var(--linha-2);background:#fff}
.bcard b{font-weight:600;display:block}
.bcard span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--fraco);display:block;margin-top:3px}
.bcard.velho span{color:var(--quente)}

/* regras */
.rr{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.rr:last-child{border:none}
.rr-c{flex:1;min-width:230px}
.rr-c b{font-weight:600;font-size:13.5px}
.rr-c span{display:block;font-size:12.5px;color:var(--fraco);margin-top:2px}
.sw{width:38px;height:21px;border-radius:20px;background:var(--linha-2);position:relative;transition:.16s;flex:none}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.16s}
.sw.on{background:var(--resolver)}
.sw.on::after{transform:translateX(17px)}

/* barras */
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin:14px 0 4px}
.bars .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .c i{width:100%;background:linear-gradient(180deg,#2B57D4,#5C77C9);border-radius:3px 3px 0 0;display:block}
.bars .c em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fraco)}
.bars .c b{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500}

/* toast */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--tinta);color:#fff;border-radius:9px;padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px -10px #131a2b80;pointer-events:auto;animation:tin .22s ease both;max-width:min(92vw,520px)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast button{color:#8ED8BC;font-weight:600;font-size:12.5px;white-space:nowrap}
.toast.alerta{background:var(--quente)}
.toast.alerta button{color:#fff;text-decoration:underline}

/* cursor de teclado */
.lr.cur{box-shadow:inset 3px 0 0 var(--tinta);background:var(--papel-2)}
.atalhos{position:fixed;bottom:12px;right:14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--fraco-2);background:#ffffffd9;border:1px solid var(--linha);border-radius:7px;padding:5px 9px;z-index:30}
.atalhos b{color:var(--fraco);font-weight:500}
kbd{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--papel);border:1px solid var(--linha-2);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--fraco)}

/* paleta */
.pal-bg{position:fixed;inset:0;background:#131a2b4d;z-index:70;display:none}
.pal-bg.on{display:block}
.pal{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:#fff;border-radius:12px;box-shadow:0 24px 70px -20px #131a2b99;z-index:71;overflow:hidden;display:none}
.pal.on{display:block}
.pal input{width:100%;border:none;border-bottom:1px solid var(--linha);padding:14px 16px;font-size:15px;outline:none}
.pal-l{max-height:340px;overflow-y:auto;padding:6px}
.pal-i{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;font-size:13.5px;cursor:pointer}
.pal-i.on{background:var(--papel-2)}
.pal-i .k{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fraco-2);border:1px solid var(--linha);border-radius:4px;padding:1px 5px;flex:none}
.pal-i .d{margin-left:auto;font-size:11.5px;color:var(--fraco-2)}

/* aprendizado */
.aprend{background:#fff;border:1px solid #6d4ac440;border-left:3px solid var(--adiar);border-radius:8px;padding:13px 15px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.aprend .txt{flex:1;min-width:240px;font-size:13.5px}
.aprend .txt b{font-weight:600;display:block;margin-bottom:2px}
.aprend .txt span{color:var(--fraco);font-size:12.5px}

/* workspace do bloco */
.ws-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ws-top h1{font-size:20px;font-weight:800;flex:1;min-width:220px}
.ws{display:grid;grid-template-columns:290px minmax(0,1fr) 330px;gap:12px;align-items:start}
.ws-col{background:#fff;border:1px solid var(--linha);border-radius:9px;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
.ws-h{padding:11px 14px;border-bottom:1px solid var(--linha);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex:none}
.ws-h span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco-2);font-weight:400}
.ws-b{padding:13px 14px;overflow-y:auto}
.dsr{font-size:12.5px;padding:9px 0;border-bottom:1px dashed var(--linha)}
.dsr:last-child{border:none}
.dsr b{display:block;font-weight:600;font-size:12.5px}
.dsr span{color:var(--fraco)}
.perg{display:block;width:100%;text-align:left;border:1px solid var(--linha-2);border-radius:7px;padding:8px 10px;font-size:12.5px;margin-bottom:6px;background:#fff;transition:.13s}
.perg:hover{border-color:var(--repassar);background:var(--papel-2)}
.resp{background:var(--papel-2);border:1px solid var(--linha);border-left:2px solid var(--repassar);border-radius:0 7px 7px 0;padding:10px 12px;font-size:12.5px;margin:0 0 8px}
.resp .fonte{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fraco-2);margin-top:6px;display:block}
.opt{border:1px solid var(--linha);border-radius:8px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:.13s}
.opt:hover{border-color:var(--linha-2)}
.opt.on{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.opt.rec{background:#0f8a6306}
.opt-t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.opt-t .rec-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:#0f8a6318;color:var(--resolver);padding:2px 7px;border-radius:5px}
.opt-d{font-size:12.5px;color:var(--fraco);margin-top:3px}
.opt-c{font-size:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--linha)}
.opt-c b{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco);display:block;margin-bottom:2px}
.ckl{list-style:none;margin:0 0 14px;padding:0}
.ckl li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--linha);font-size:12.5px}
.ckl li:last-child{border:none}
.ckl .mk{width:15px;height:15px;border-radius:4px;flex:none;display:grid;place-items:center;font-size:9px;color:#fff;margin-top:1px}
.ckl .ok{background:var(--resolver)}
.ckl .no{background:var(--quente)}
.ckl .jd{background:var(--reservar)}
.ckl b{font-weight:600}
.ckl span{display:block;color:var(--fraco);font-size:11.5px}
.ta{width:100%;min-height:190px;border:1px solid var(--linha);border-radius:8px;padding:11px;font-size:13px;line-height:1.55;resize:vertical;font-family:inherit;background:var(--papel-2)}
.ta:focus{background:#fff;outline:none;border-color:var(--linha-2)}
@media (max-width:1100px){ .ws{grid-template-columns:1fr} .ws-col{max-height:none} }
@media (max-width:900px){ .atalhos{display:none} }

@media (max-width:900px){
  :root{--sb:0px}
  .sb{position:fixed;left:0;top:0;bottom:0;width:236px;transform:translateX(-100%);transition:transform .22s;z-index:50}
  .sb.on{transform:none}
  .hamb{display:block;padding:6px 9px;border-radius:7px;font-size:16px}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(6,minmax(140px,1fr))}
  .corpo{padding:16px 14px 60px}
}

/* ================= helpers ================= */
function fmtEspera(ms){
  var d = Math.floor(ms/D); if(d>=1) return d+"d";
  var h = Math.floor(ms/H); if(h>=1) return h+"h";
  return Math.max(1,Math.floor(ms/MIN))+"min";
}
function fmtRestante(ms){
  if(ms<=0) return "vencido";
  var h = Math.floor(ms/H), m = Math.floor(ms%H/MIN), s = Math.floor(ms%MIN/1000);
  if(h>0) return h+"h "+String(m).padStart(2,"0")+"m";
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
var COR = {entrada:"var(--repassar)",delegado:"var(--resolver)",agendado:"var(--reservar)",dormindo:"var(--repousar)",fechado:"var(--linha-2)"};
var STN = {entrada:"entrada",delegado:"delegado",agendado:"bloco",dormindo:"dormindo",fechado:"fechado"};

function toast(txt, undo, alerta){
  var el = document.createElement("div");
  el.className = "toast" + (alerta?" alerta":"");
  el.innerHTML = '<span>'+esc(txt)+'</span>';
  if(undo){
    var b = document.createElement("button");
    b.textContent = "desfazer";
    b.onclick = function(){ undo(); el.remove(); };
    el.appendChild(b);
  }
  $("#toasts").appendChild(el);
  setTimeout(function(){ el.style.transition="opacity .3s"; el.style.opacity=0; setTimeout(function(){el.remove();},320); }, undo?6000:3600);
}
function notif(txt){
  DB.notifs.push(txt);

/* ================= listas ================= */
function filtra(base){
  var q = UI.busca.trim().toLowerCase();
  return base.filter(function(x){
    if(UI.fHz!=="todos" && x.hz!==UI.fHz) return false;
    if(UI.fSt!=="todos" && x.st!==UI.fSt) return false;
    if(q && (x.t+" "+x.quem+" "+x.canal+" "+(x.dono||"")).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function linha(x){
  var meta = [];
  meta.push('<span>'+esc(x.canal)+' · '+esc(x.quem)+'</span>');
  if(x.dono) meta.push('<span class="pill p-n">'+esc(x.dono)+' · '+(x.nivel||"").toUpperCase()+'</span>');
  if(x.temp>2) meta.push('<span class="pill p-quente">'+x.temp+' cobranças</span>');
  if(x.adiado) meta.push('<span class="pill p-adiado">adiado '+x.adiado+'×</span>');
  if(x.st==="agendado" && x.quando) meta.push('<span>'+esc(x.quando)+'</span>');
  if(x.st==="dormindo" && x.volta) meta.push('<span>volta '+esc(x.volta)+'</span>');

  var dir = "";
  if(x.st==="delegado" && x.venc){
    var r = x.venc - agora();
    dir += '<span class="rel'+(r<10*MIN?" urg":"")+'" data-timer="'+x.id+'">'+fmtRestante(r)+'</span>';
  } else {
    dir += '<span class="rel">'+fmtEspera(x.espera||0)+'</span>';
  }
  dir += '<span class="pill p-'+x.st+'">'+STN[x.st]+'</span>';

  return '<div class="lr'+(UI.sel===x.id?" sel":"")+'" data-id="'+x.id+'" style="--c:'+COR[x.st]+'">'
    + '<span class="lr-bar"></span>'
    + '<div class="lr-mid"><div class="lr-t">'+esc(x.t)+'</div><div class="lr-m">'+meta.join("")+'</div></div>'
    + '<div class="lr-dir">'+dir+'</div></div>';
}
function listaHTML(arr, vazio){
  if(!arr.length) return '<div class="lista"><div class="vazio-l">'+esc(vazio)+'</div></div>';
  return '<div class="lista">'+arr.map(linha).join("")+'</div>';
}
function filtrosHTML(comSt){
  var hz = [["todos","Todos"],["hoje","Hoje"],["semana","Semana"],["trimestre","Trimestre"]];
  var stt = [["todos","Todos"],["entrada","Entrada"],["delegado","Delegado"],["agendado","Bloco"],["dormindo","Dormindo"],["fechado","Fechado"]];
  var o = '<div class="filtros">';
  o += hz.map(function(p){ return '<button class="fchip'+(UI.fHz===p[0]?" on":"")+'" data-fhz="'+p[0]+'">'+p[1]+'</button>'; }).join("");
  if(comSt){
    o += '<span class="fsep"></span>';
    o += stt.map(function(p){ return '<button class="fchip'+(UI.fSt===p[0]?" on":"")+'" data-fst="'+p[0]+'">'+p[1]+'</button>'; }).join("");
  }
  return o + '</div>';
}

function linhasVisiveis(){ return Array.prototype.slice.call(document.querySelectorAll("#corpo .lr")); }
function marcaCursor(){
  var ls = linhasVisiveis();
  if(!ls.length){ UI.cursor = -1; return; }
  if(UI.cursor < 0 || UI.cursor >= ls.length) UI.cursor = 0;
  ls.forEach(function(el,i){ el.classList.toggle("cur", i===UI.cursor); });
}
function moveCursor(d){
  var ls = linhasVisiveis(); if(!ls.length) return;
  UI.cursor = Math.max(0, Math.min(ls.length-1, (UI.cursor<0?0:UI.cursor) + d));
  marcaCursor();
  ls[UI.cursor].scrollIntoView({block:"nearest"});
}
function idNoCursor(){
  var ls = linhasVisiveis();
  return (UI.cursor>=0 && ls[UI.cursor]) ? ls[UI.cursor].dataset.id : null;
}

/* ================= ações ================= */
function reg(x, txt){ x.trilha.unshift({q:"agora", x:txt}); }
function snapshot(x){ return JSON.parse(JSON.stringify(x)); }
function restaura(snap){
  var x = item(snap.id);
  Object.keys(snap).forEach(function(k){ x[k] = snap[k]; });
  render(); if(UI.sel===x.id) renderDrawer();
}

function aplicar(id, saida){
  var x = item(id), snap = snapshot(x);
  if(saida === "resolver"){ x.st="fechado"; reg(x,"Resolvido · "+esc(x.quem)+" avisado no canal de origem"); toast("Resolvido — "+x.t, function(){restaura(snap);}); }
  if(saida === "reservar"){ x.st="agendado"; x.quando="qui 09:00"; reg(x,"Reservado · bloco quinta 9h · dossiê na quarta"); toast("Bloco marcado para quinta 9h", function(){restaura(snap);}); }
  if(saida === "repousar"){ x.st="dormindo"; x.volta="em 15 dias"; reg(x,"Repousado · volta em 15 dias ou se alguém cobrar"); toast("Adormecido por 15 dias", function(){restaura(snap);}); }
  if(saida === "repassar"){
    x.st="delegado"; x.dono=UI.tmp.dono; x.nivel=UI.tmp.nivel;
    if(x.nivel==="n2"){ x.venc = agora() + (UI.tmp.prazo==="4 horas"?4*H:UI.tmp.prazo==="hoje"?6*H:UI.tmp.prazo==="amanhã"?28*H:3*D); }
    else x.venc = null;
    reg(x,"Repassado · "+x.dono+" · "+x.nivel.toUpperCase()+" · "+UI.tmp.prazo);
    toast("Repassado para "+x.dono+" ("+x.nivel.toUpperCase()+")", function(){restaura(snap);});
  }
  if(saida === "adiar"){
    x.adiado = (x.adiado||0)+1;
    reg(x,"Adiado · volta em "+UI.tmp.volta+" · falta: "+(UI.tmp.falta||"não informado"));
    toast("Adiado — "+(x.adiado)+"º adiamento deste item", function(){restaura(snap);});
  }
  UI.form = null;
  if(saida !== "adiar") fecharDrawer(); else renderDrawer();
  render();
}

        : base.replace(/, tudo bem\?\n\nEspero que sim\./, ",");

  var act0 = t.closest("[data-act]");

  }

  var act = t.closest("[data-act]"); if(!act) return;

  if(a === "sair-bloco"){ UI.view="agenda"; UI.blocoId=null; UI.tmp={}; render(); return; }
  if(a === "decidir-bloco"){
    var xb = item(UI.blocoId), Bb = BLOCOS[UI.blocoId];
    var selK = UI.tmp.opt || (Bb.opcoes.filter(function(o){return o.rec;})[0]||Bb.opcoes[0]).k;
    var opb = Bb.opcoes.filter(function(o){return o.k===selK;})[0];

    if(Bb.aprend) UI.aprend = Bb.aprend;
    UI.view = "agenda"; UI.blocoId = null; UI.tmp = {}; render(); return;
  }

  if(a === "fechar-dr" || a === "cancelar"){ if(a==="cancelar"){ UI.form=null; renderDrawer(); } else fecharDrawer(); return; }
  if(a.indexOf("saida-") === 0){
    var k = a.slice(6);
    if(k === "repassar"){ UI.form="repassar"; renderDrawer(); } else aplicar(UI.sel, k);
    return;
  }
  if(a === "form-adiar"){ UI.form="adiar"; renderDrawer(); return; }
  if(a === "form-repassar"){ UI.form="repassar"; renderDrawer(); return; }
  if(a === "conf-repassar"){ aplicar(UI.sel,"repassar"); return; }
  if(a === "conf-adiar"){ aplicar(UI.sel,"adiar"); return; }
  if(a === "conf-reservar"){ aplicar(UI.sel,"reservar"); return; }
  if(a === "conf-resolver"){ aplicar(UI.sel,"resolver"); return; }
  if(a === "parar"){
    var x = item(UI.sel), s = snapshot(x);
    x.st="entrada"; x.venc=null; reg(x,"Você interrompeu o N2 — voltou para a sua mesa");
    toast("N2 interrompido. Item de volta na entrada.", function(){restaura(s);}); fecharDrawer(); return;
  }
  if(a === "promover"){

    toast("Promovido para N1. Essa classe não volta mais para você.", function(){restaura(s2);}); renderDrawer(); render(); return;
  }
  if(a === "reabrir"){

  if(a === "esteira-check"){

    toast("Checklist aplicado: 3 integradores seguiram sozinhos. Só o Panorama exige você.");
    render(); return;
  }
});

/* ================= paleta de comandos ================= */
function palItens(){
  var q = $("#palIn").value.trim().toLowerCase();
  var out = [];
  VIEWS.forEach(function(v){
    if(!q || v.nome.toLowerCase().indexOf(q)>=0) out.push({k:"ir",n:"Ir para "+v.nome,d:"navegação",f:function(){ UI.view=v.id; UI.cursor=-1; render(); }});
  });
  DB.itens.forEach(function(x){
    if(q && (x.t+" "+x.quem).toLowerCase().indexOf(q)<0) return;
    if(!q) return;
    out.push({k:x.id,n:x.t,d:STN[x.st],f:function(){ if(x.st!=="fechado"||true) abrirDrawer(x.id); }});
  });
  var extras = [
    {k:"⌥",n:"Simular nova entrada",d:"ação",f:function(){ $("#btSim").click(); }},
    {k:"⌥",n:"Aplicar checklist da esteira",d:"ação",f:function(){ INTEGRADORES.forEach(function(i){ if(i.e===3 && i.n!=="Grupo Panorama"){ i.e=4; i.d=0; } }); UI.view="esteira"; toast("Checklist aplicado."); render(); }}
  ];
  extras.forEach(function(e){ if(!q || e.n.toLowerCase().indexOf(q)>=0) out.push(e); });
  return out.slice(0,9);
}
function renderPal(){
  var its = palItens();
  UI.palSel = Math.max(0, Math.min(its.length-1, UI.palSel));
  $("#palL").innerHTML = its.map(function(i,ix){
    return '<div class="pal-i'+(ix===UI.palSel?" on":"")+'" data-pal="'+ix+'"><span class="k">'+i.k+'</span>'+esc(i.n)+'<span class="d">'+i.d+'</span></div>';
  }).join("") || '<div class="pal-i">Nada encontrado</div>';
}
function abrePal(){ UI.palSel=0; $("#pal").classList.add("on"); $("#palBg").classList.add("on"); $("#palIn").value=""; renderPal(); $("#palIn").focus(); }
function fechaPal(){ $("#pal").classList.remove("on"); $("#palBg").classList.remove("on"); }
$("#palBg").addEventListener("click", fechaPal);
$("#palIn").addEventListener("input", function(){ UI.palSel=0; renderPal(); });
$("#palL").addEventListener("click", function(e){
  var el = e.target.closest("[data-pal]"); if(!el) return;
  var it = palItens()[el.dataset.pal]; fechaPal(); if(it) it.f();
});

/* ================= teclado ================= */
document.addEventListener("keydown", function(e){
  var emCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); abrePal(); return; }

  if($("#pal").classList.contains("on")){
    if(e.key==="Escape"){ fechaPal(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); UI.palSel++; renderPal(); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); UI.palSel--; renderPal(); return; }
    if(e.key==="Enter"){ e.preventDefault(); var it = palItens()[UI.palSel]; fechaPal(); if(it) it.f(); return; }
    return;
  }

  if(e.key === "Escape"){ if(UI.sel) fecharDrawer(); return; }
  if(e.key === "/" && !emCampo){ e.preventDefault(); $("#busca").focus(); return; }
  if(emCampo) return;

  if(e.key === "j" || e.key === "ArrowDown"){ e.preventDefault(); moveCursor(1); return; }
  if(e.key === "k" || e.key === "ArrowUp"){ e.preventDefault(); moveCursor(-1); return; }
  if(e.key === "Enter"){ var id = idNoCursor(); if(id){ e.preventDefault(); abrirDrawer(id); } return; }

  var alvo = UI.sel || idNoCursor();
  if(!alvo) return;
  var x = item(alvo);
  if(!x || x.st !== "entrada") return;

  var mapa = {"1":"resolver","2":"repassar","3":"reservar","4":"repousar"};
  if(mapa[e.key]){
    e.preventDefault();
    if(mapa[e.key] === "repassar"){ if(!UI.sel) abrirDrawer(alvo); UI.form="repassar"; renderDrawer(); }
    else { UI.sel = alvo; aplicar(alvo, mapa[e.key]); UI.cursor = Math.max(0, UI.cursor); }
    return;
  }
  if(e.key === "a"){ e.preventDefault(); if(!UI.sel) abrirDrawer(alvo); UI.form="adiar"; renderDrawer(); return; }
});

        mudou = true;
      } else {
        var el = document.querySelectorAll('[data-timer="'+x.id+'"]');
        for(var i=0;i<el.length;i++){
          el[i].textContent = fmtRestante(r);
          el[i].classList.toggle("urg", r < 10*MIN);

      }
    }
  });
