name: build-image

# Builda a imagem JVM (Java 25) da Alçada — front (SPA) embutido same-origin —
# e publica no GHCR. A VPS só faz pull (build pesado nunca roda na máquina
# compartilhada). Imagem `demo`: OIDC off e Linktor real (piloto controlado).
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'spec/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/alcada
  QUARKUS_PROFILE: demo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # --- Front: gera web/dist, que o profile Maven `spa` embute no app ---
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web (SPA)
        working-directory: web
        env:
          # O backend demo usa X-Org-Id/X-Pessoa-Id e não sobe OIDC.
          VITE_LOGIN_DEMO: "true"
          VITE_OIDC_ENABLED: "false"
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # --- Backend: empacota (fast-jar) no profile demo ---
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Package (Quarkus, profile demo)
        run: mvn -B -ntp package -DskipTests -Dquarkus.profile=demo

      # --- Imagem ---
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
