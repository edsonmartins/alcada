name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alcada
          POSTGRES_PASSWORD: alcada
          POSTGRES_DB: alcada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alcada -d alcada_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # role alcada precisa existir também como não-superusuário para o REVOKE da trilha valer
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/alcada_test
      QUARKUS_DATASOURCE_USERNAME: alcada
      QUARKUS_DATASOURCE_PASSWORD: alcada

    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      # Build JVM + testes (inclui ArchUnit de fronteiras, guarda org_id,
      # trilha append-only, outbox transacional, scheduler)
      - name: Build e testes (JVM)
        run: mvn -B verify

      # Validação explícita do Flyway contra o schema aplicado
      - name: Flyway validate
        run: mvn -B flyway:validate

  # Build nativo NÃO roda aqui — só no release (é lento). Ver release.yml.
